# ===== RecipeRev =====
spring.application.name=RecipeRev

# ----- DB(値は環境変数で上書きできる。既定値は docker-compose.yml と同じ) -----
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:reciperev}?connectionTimeZone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:reciperev}
spring.datasource.password=${DB_PASSWORD:reciperev}

# テーブルはFlywayで作るので、JPAは「エンティティとテーブル定義が一致しているか」の検査だけ行う
spring.jpa.hibernate.ddl-auto=validate
# 画面描画中に遅延ロードを走らせない(N+1 や想定外のSQLに気づけるようにするため)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

spring.flyway.enabled=true

# フラッシュメッセージ用のセッションIDをURL(;jsessionid=...)に埋め込まない
server.servlet.session.tracking-modes=cookie

# ----- 多言語対応 -----
# messages_en.properties は無いので、英語は messages.properties(既定)を使わせる。
# true のままだと、OS の言語が日本語の PC では「英語が無い → OS の言語(日本語)」と誤って切り替わってしまう
spring.messages.fallback-to-system-locale=false

# ----- アップロード(写真は1枚5MBまで) -----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# 上限を超えた送信でも接続を切らずに最後まで受け取り、エラー画面を返せるようにする(Tomcat の既定は2MBで打ち切り)
server.tomcat.max-swallow-size=10MB
reciperev.upload-dir=uploads

# ----- Python 傾向分析 -----
# uv で analysis/ のプロジェクト(pyproject.toml / uv.lock、Python 3.15.1)を実行する。
# 初回は uv が Python と pandas を analysis/.venv に自動で用意する(--frozen: uv.lock どおりに入れ、勝手に更新しない)
reciperev.analysis.command=uv,run,--project,analysis,--frozen,--quiet,python
reciperev.analysis.script=analysis/analyze.py
reciperev.analysis.work-dir=analysis/output
# 初回は Python と pandas のダウンロードが入るので長めにしておく
reciperev.analysis.timeout-seconds=120

# ----- デモデータ(demo プロファイルのとき)の言語: en / ja -----
reciperev.demo.locale=en

# ----- ログ -----
logging.level.com.shim369.reciperev=INFO
