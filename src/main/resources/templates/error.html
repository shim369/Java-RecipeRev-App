<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head(${errorTitle} ?: #{error.title.default})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <section class="card error-card">
        <!--/* @ControllerAdvice から来たときは errorTitle、Spring Boot 標準のエラー処理から来たときは status/error が入る */-->
        <h1 th:text="${errorTitle} ?: (${status} ? ${status} + ' ' + ${error} : #{error.title.default})">Error</h1>
        <p th:text="${errorMessage} ?: #{error.message.default}">Message</p>
        <a class="btn" th:href="@{/recipes}" th:text="#{error.backToList}">Back to recipes</a>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
