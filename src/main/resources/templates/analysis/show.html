<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head(${recipe.name} + ' ' + #{analysis.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <nav class="breadcrumb">
        <a th:href="@{/recipes}" th:text="#{nav.recipes}">Recipes</a> &rsaquo;
        <a th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="${recipe.name}">Curry</a> &rsaquo; <span th:text="#{analysis.title}"></span>
    </nav>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="page-head">
        <div>
            <h1 th:text="#{analysis.title}">Trend analysis</h1>
            <p class="hint" th:text="#{analysis.hint}"></p>
        </div>
        <form th:action="@{/recipes/{id}/analysis(id=${recipe.id})}" method="post">
            <button type="submit" class="btn btn-primary" th:text="#{analysis.run}">Run analysis</button>
        </form>
    </div>

    <p class="empty" th:unless="${result}" th:text="#{analysis.empty}"></p>

    <th:block th:if="${result}">
        <section class="card">
            <p class="muted" th:text="#{analysis.meta(${#temporals.format(result.generatedAt, 'yyyy-MM-dd HH:mm')}, ${result.versionCount}, ${result.minSamples})}"></p>
            <h2 th:text="#{analysis.results}">Trends by ingredient</h2>
            <p class="muted" th:if="${result.results.isEmpty()}" th:text="#{analysis.noResults}"></p>
            <div class="table-scroll" th:unless="${result.results.isEmpty()}">
                <table class="table">
                    <thead>
                    <tr>
                        <th th:text="#{analysis.col.ingredient}">Ingredient</th><th th:text="#{analysis.col.unit}">Unit</th>
                        <th class="num" th:text="#{analysis.col.r}">r</th><th th:text="#{analysis.col.strength}">Strength</th>
                        <th th:text="#{analysis.col.trend}">Trend</th><th class="num" th:text="#{analysis.col.range}">Range</th>
                        <th class="num" th:text="#{analysis.col.versions}">Versions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!--/* 傾向の文章は analysis.sentence.positive / negative / weak を言語ごとに切り替える */-->
                    <tr th:each="c : ${result.results}">
                        <td th:text="${c.ingredient}">Sugar</td>
                        <td th:text="${c.unit}">g</td>
                        <td class="num" th:text="${#numbers.formatDecimal(c.r, 1, 3)}">0.870</td>
                        <td th:classappend="${c.strength == 'STRONG'} ? 'strength-strong'" th:text="#{${'analysis.strength.' + c.strength}}">Strong</td>
                        <td th:with="name=${c.hasUnit()} ? #{analysis.ingredientWithUnit(${c.ingredient}, ${c.unit})} : ${c.ingredient}"
                            th:text="#{${'analysis.sentence.' + c.sentenceKey()}(${name})}">Versions with more Sugar (g) tend to score higher</td>
                        <td class="num" th:text="#{analysis.range(${c.minLabel()}, ${c.maxLabel()})}">30–50</td>
                        <td class="num" th:text="${c.samples}">4</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card" th:unless="${result.insufficient.isEmpty()}">
            <h2 th:text="#{analysis.insufficient}">Ingredients not analyzed</h2>
            <table class="table table-compact">
                <tbody>
                <tr th:each="i : ${result.insufficient}">
                    <td th:text="${i.unit} != '' ? #{analysis.ingredientWithUnit(${i.ingredient}, ${i.unit})} : ${i.ingredient}">Egg (pcs)</td>
                    <td class="muted" th:text="#{${'analysis.reason.' + i.reason}}">The amount is the same in every version</td>
                </tr>
                </tbody>
            </table>
        </section>

        <p class="note-box" th:text="#{analysis.causation}"></p>

        <details class="card">
            <summary th:text="#{analysis.json}">Result JSON</summary>
            <pre class="json" th:text="${rawJson}">{}</pre>
        </details>
    </th:block>

    <a class="btn" th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="#{common.back}">Back</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
