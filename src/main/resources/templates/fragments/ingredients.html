<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  材料・手順・変更メモの入力欄(SCR-02 と SCR-05 で共通)。
  th:object="${form}" の中で使う前提。材料行の name は ingredients[0].name のような連番で、
  Spring がこれを List<IngredientForm> に詰め直してくれる。行の追加・削除は ingredient-editor.js が担当する。
*/-->
<th:block th:fragment="editor">
    <fieldset class="field">
        <legend><th:block th:text="#{ingredients.legend}">Ingredients</th:block> <span class="required" th:text="#{common.required}">Required</span></legend>
        <p class="hint" th:text="#{ingredients.hint}"></p>
        <p class="field-error" th:if="${#fields.hasErrors('ingredients')}" th:errors="*{ingredients}"></p>
        <p class="field-error" th:if="${#fields.hasErrors('ingredientNamesUnique')}" th:errors="*{ingredientNamesUnique}"></p>
        <table class="ingredient-table" data-ingredient-table>
            <thead>
            <tr>
                <th th:text="#{ingredients.col.name}">Name</th><th th:text="#{ingredients.col.amount}">Amount</th>
                <th th:text="#{ingredients.col.unit}">Unit</th><th th:text="#{ingredients.col.note}">Note</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ing, stat : *{ingredients}" data-ingredient-row>
                <td>
                    <input type="text" th:field="*{ingredients[__${stat.index}__].name}" maxlength="50" th:placeholder="#{ingredients.placeholder.name}" th:attr="aria-label=#{ingredients.col.name}">
                    <p class="field-error" th:if="${#fields.hasErrors('ingredients[__${stat.index}__].name')}" th:errors="*{ingredients[__${stat.index}__].name}"></p>
                </td>
                <td>
                    <input type="number" th:field="*{ingredients[__${stat.index}__].amount}" step="0.01" min="0" max="99999.99" class="input-amount" th:placeholder="#{ingredients.col.amount}" th:attr="aria-label=#{ingredients.col.amount}">
                    <p class="field-error" th:if="${#fields.hasErrors('ingredients[__${stat.index}__].amount')}" th:errors="*{ingredients[__${stat.index}__].amount}"></p>
                </td>
                <td><input type="text" th:field="*{ingredients[__${stat.index}__].unit}" maxlength="20" class="input-unit" th:placeholder="#{ingredients.placeholder.unit}" th:attr="aria-label=#{ingredients.col.unit}"></td>
                <td><input type="text" th:field="*{ingredients[__${stat.index}__].note}" maxlength="100" th:placeholder="#{ingredients.placeholder.note}" th:attr="aria-label=#{ingredients.col.note}"></td>
                <td><button type="button" class="btn btn-small btn-ghost" data-remove-row th:text="#{ingredients.removeRow}">Remove</button></td>
            </tr>
            </tbody>
        </table>
        <!--/* JS で複製する空の行。name の __INDEX__ を連番に置き換えて使う */-->
        <template data-ingredient-template>
            <tr data-ingredient-row>
                <td><input type="text" name="ingredients[__INDEX__].name" maxlength="50" th:placeholder="#{ingredients.placeholder.name}" th:attr="aria-label=#{ingredients.col.name}"></td>
                <td><input type="number" name="ingredients[__INDEX__].amount" step="0.01" min="0" max="99999.99" class="input-amount" th:placeholder="#{ingredients.col.amount}" th:attr="aria-label=#{ingredients.col.amount}"></td>
                <td><input type="text" name="ingredients[__INDEX__].unit" maxlength="20" class="input-unit" th:placeholder="#{ingredients.placeholder.unit}" th:attr="aria-label=#{ingredients.col.unit}"></td>
                <td><input type="text" name="ingredients[__INDEX__].note" maxlength="100" th:placeholder="#{ingredients.placeholder.note}" th:attr="aria-label=#{ingredients.col.note}"></td>
                <td><button type="button" class="btn btn-small btn-ghost" data-remove-row th:text="#{ingredients.removeRow}">Remove</button></td>
            </tr>
        </template>
        <button type="button" class="btn btn-small" data-add-row th:text="#{ingredients.addRow}">+ Add ingredient</button>
    </fieldset>

    <div class="field">
        <label for="steps"><th:block th:text="#{steps.label}">Steps</th:block> <span class="required" th:text="#{common.required}">Required</span></label>
        <p class="hint" th:text="#{steps.hint}"></p>
        <textarea id="steps" th:field="*{steps}" rows="8"></textarea>
        <p class="field-error" th:if="${#fields.hasErrors('stepCountValid')}" th:errors="*{stepCountValid}"></p>
        <p class="field-error" th:if="${#fields.hasErrors('stepLengthValid')}" th:errors="*{stepLengthValid}"></p>
    </div>

    <div class="field">
        <label for="changeNote" th:text="#{changeNote.label}">Change note</label>
        <input type="text" id="changeNote" th:field="*{changeNote}" maxlength="200" th:placeholder="#{changeNote.placeholder}">
        <p class="field-error" th:if="${#fields.hasErrors('changeNote')}" th:errors="*{changeNote}"></p>
    </div>
</th:block>
</body>
</html>
