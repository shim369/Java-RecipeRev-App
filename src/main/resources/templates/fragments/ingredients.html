<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<body>
<!--/*
  材料・手順・変更メモの入力欄(SCR-02 と SCR-05 で共通)。
  th:object="${form}" の中で使う前提。材料行の name は ingredients[0].name のような連番で、
  Spring がこれを List<IngredientForm> に詰め直してくれる。行の追加・削除は ingredient-editor.js が担当する。
*/-->
<th:block th:fragment="editor">
    <fieldset class="field">
        <legend>材料 <span class="required">必須</span></legend>
        <p class="hint">分量は数値で入力します。「少々」などは分量を空欄にしてメモに書いてください(傾向分析では数値の行だけを使います)。</p>
        <p class="field-error" th:if="${#fields.hasErrors('ingredients')}" th:errors="*{ingredients}"></p>
        <p class="field-error" th:if="${#fields.hasErrors('ingredientNamesUnique')}" th:errors="*{ingredientNamesUnique}"></p>
        <table class="ingredient-table" data-ingredient-table>
            <thead>
            <tr><th>材料名</th><th>分量</th><th>単位</th><th>メモ</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="ing, stat : *{ingredients}" data-ingredient-row>
                <td>
                    <input type="text" th:field="*{ingredients[__${stat.index}__].name}" maxlength="50" placeholder="砂糖" aria-label="材料名">
                    <p class="field-error" th:if="${#fields.hasErrors('ingredients[__${stat.index}__].name')}" th:errors="*{ingredients[__${stat.index}__].name}"></p>
                </td>
                <td>
                    <input type="number" th:field="*{ingredients[__${stat.index}__].amount}" step="0.01" min="0" max="99999.99" class="input-amount" placeholder="分量" aria-label="分量">
                    <p class="field-error" th:if="${#fields.hasErrors('ingredients[__${stat.index}__].amount')}" th:errors="*{ingredients[__${stat.index}__].amount}"></p>
                </td>
                <td><input type="text" th:field="*{ingredients[__${stat.index}__].unit}" maxlength="20" placeholder="g" class="input-unit" aria-label="単位"></td>
                <td><input type="text" th:field="*{ingredients[__${stat.index}__].note}" maxlength="100" placeholder="少々 など" aria-label="メモ"></td>
                <td><button type="button" class="btn btn-small btn-ghost" data-remove-row>削除</button></td>
            </tr>
            </tbody>
        </table>
        <!--/* JS で複製する空の行。name の __INDEX__ を連番に置き換えて使う */-->
        <template data-ingredient-template>
            <tr data-ingredient-row>
                <td><input type="text" name="ingredients[__INDEX__].name" maxlength="50" placeholder="砂糖" aria-label="材料名"></td>
                <td><input type="number" name="ingredients[__INDEX__].amount" step="0.01" min="0" max="99999.99" class="input-amount" placeholder="分量" aria-label="分量"></td>
                <td><input type="text" name="ingredients[__INDEX__].unit" maxlength="20" placeholder="g" class="input-unit" aria-label="単位"></td>
                <td><input type="text" name="ingredients[__INDEX__].note" maxlength="100" placeholder="少々 など" aria-label="メモ"></td>
                <td><button type="button" class="btn btn-small btn-ghost" data-remove-row>削除</button></td>
            </tr>
        </template>
        <button type="button" class="btn btn-small" data-add-row>+ 材料を追加</button>
    </fieldset>

    <div class="field">
        <label for="steps">手順 <span class="required">必須</span></label>
        <p class="hint">1行に1つの手順を書きます(空行は無視されます)。版の比較は行単位で行います。</p>
        <textarea id="steps" th:field="*{steps}" rows="8"></textarea>
        <p class="field-error" th:if="${#fields.hasErrors('stepCountValid')}" th:errors="*{stepCountValid}"></p>
        <p class="field-error" th:if="${#fields.hasErrors('stepLengthValid')}" th:errors="*{stepLengthValid}"></p>
    </div>

    <div class="field">
        <label for="changeNote">変更メモ</label>
        <input type="text" id="changeNote" th:field="*{changeNote}" maxlength="200" placeholder="例: 砂糖を10g増やした">
        <p class="field-error" th:if="${#fields.hasErrors('changeNote')}" th:errors="*{changeNote}"></p>
    </div>
</th:block>
</body>
</html>
