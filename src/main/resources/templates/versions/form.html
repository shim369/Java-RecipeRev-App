<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head('新しい版の作成')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container" th:with="recipe=${detail.recipe}, base=${detail.version}">
    <nav class="breadcrumb">
        <a th:href="@{/recipes}">レシピ一覧</a> &rsaquo;
        <a th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="${recipe.name}">カレー</a> &rsaquo; 新しい版の作成
    </nav>
    <h1>新しい版の作成</h1>
    <p class="hint">
        派生元: <a th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${base.versionNo})}" th:text="'第' + ${base.versionNo} + '版'">第2版</a>
        <span th:replace="~{fragments/layout :: status(${base.status})}"></span>
        — 保存すると最新の版番号で新しい版(下書き)が作られます。派生元の版は変わりません。
    </p>

    <form class="card form" th:action="@{/recipes/{id}/versions(id=${recipe.id}, base=${base.versionNo})}"
          th:object="${form}" method="post" novalidate>
        <!--/* #fields.globalErrors(): 特定の項目に結びつかないエラー(BR-03「変更がありません」など) */-->
        <div class="form-errors" th:if="${#fields.hasAnyErrors()}" role="alert">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="margin:0"></p>
            <p th:unless="${#fields.hasGlobalErrors()}" style="margin:0">入力内容を確認してください。</p>
        </div>

        <th:block th:replace="~{fragments/ingredients :: editor}"></th:block>

        <div class="actions">
            <button type="submit" class="btn btn-primary">新しい版として保存</button>
            <a class="btn btn-ghost" th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${base.versionNo})}">キャンセル</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/ingredient-editor.js}"></script>
</body>
</html>
