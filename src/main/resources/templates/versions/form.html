<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head(#{versionForm.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container" th:with="recipe=${detail.recipe}, base=${detail.version}">
    <nav class="breadcrumb">
        <a th:href="@{/recipes}" th:text="#{nav.recipes}">Recipes</a> &rsaquo;
        <a th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="${recipe.name}">Curry</a> &rsaquo; <span th:text="#{versionForm.title}"></span>
    </nav>
    <h1 th:text="#{versionForm.title}">New version</h1>
    <p class="hint">
        <span th:text="#{versionForm.basedOn}">Based on:</span>
        <a th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${base.versionNo})}" th:text="#{version.label(${base.versionNo})}">v2</a>
        <span th:replace="~{fragments/layout :: status(${base.status})}"></span>
        <span th:text="#{versionForm.hint}"></span>
    </p>

    <form class="card form" th:action="@{/recipes/{id}/versions(id=${recipe.id}, base=${base.versionNo})}"
          th:object="${form}" method="post" novalidate>
        <!--/* #fields.globalErrors(): 特定の項目に結びつかないエラー(BR-03「変更がありません」など) */-->
        <div class="form-errors" th:if="${#fields.hasAnyErrors()}" role="alert">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="margin:0"></p>
            <p th:unless="${#fields.hasGlobalErrors()}" style="margin:0" th:text="#{common.formErrors}"></p>
        </div>

        <th:block th:replace="~{fragments/ingredients :: editor}"></th:block>

        <div class="actions">
            <button type="submit" class="btn btn-primary" th:text="#{versionForm.submit}">Save as new version</button>
            <a class="btn btn-ghost" th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${base.versionNo})}" th:text="#{common.cancel}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/ingredient-editor.js}"></script>
</body>
</html>
