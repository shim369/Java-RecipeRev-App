<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head(${view.recipe.name} + ' ' + #{diff.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container" th:with="recipe=${view.recipe}">
    <nav class="breadcrumb">
        <a th:href="@{/recipes}" th:text="#{nav.recipes}">Recipes</a> &rsaquo;
        <a th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="${recipe.name}">Curry</a> &rsaquo; <span th:text="#{diff.title}"></span>
    </nav>
    <h1 th:text="#{diff.title}">Compare versions</h1>

    <!--/* GET フォーム: 比較条件を URL に残すので、ブックマークや共有ができる */-->
    <form class="card compare-form" th:action="@{/recipes/{id}/diff(id=${recipe.id})}" method="get">
        <div>
            <label for="from" th:text="#{diff.from}">From</label>
            <select id="from" name="from">
                <option th:each="s : ${view.allVersions}" th:value="${s.versionNo}" th:selected="${s.versionNo == view.from.versionNo}"
                        th:text="#{diff.option(${s.versionNo}, #{${s.status.messageKey()}})}">v1 (Draft)</option>
            </select>
        </div>
        <div>
            <label for="to" th:text="#{diff.to}">To</label>
            <select id="to" name="to">
                <option th:each="s : ${view.allVersions}" th:value="${s.versionNo}" th:selected="${s.versionNo == view.to.versionNo}"
                        th:text="#{diff.option(${s.versionNo}, #{${s.status.messageKey()}})}">v2 (Trial)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{diff.submit}">Compare</button>
    </form>

    <section class="card">
        <h2>
            <a th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${view.from.versionNo})}" th:text="#{version.label(${view.from.versionNo})}">v1</a>
            <span th:replace="~{fragments/layout :: status(${view.from.status})}"></span>
            <span class="muted">→</span>
            <a th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${view.to.versionNo})}" th:text="#{version.label(${view.to.versionNo})}">v2</a>
            <span th:replace="~{fragments/layout :: status(${view.to.status})}"></span>
        </h2>
        <p class="muted">
            <span th:text="#{diff.avg}">Avg. rating:</span>
            <span th:text="${view.from.averageRating} ? ${#numbers.formatDecimal(view.from.averageRating, 1, 2)} : '—'">3.00</span>
            →
            <strong th:text="${view.to.averageRating} ? ${#numbers.formatDecimal(view.to.averageRating, 1, 2)} : '—'">4.50</strong>
        </p>
        <div class="diff-summary">
            <span class="diff-added" th:text="#{diff.added(${view.added()})}">+ Added 1</span>
            <span class="diff-removed" th:text="#{diff.removed(${view.removed()})}">− Removed 0</span>
            <span class="diff-changed" th:text="#{diff.changed(${view.changed()})}">~ Changed 2</span>
        </div>
        <p th:unless="${view.diff.hasChanges()}" class="muted" th:text="#{diff.noChanges}"></p>
    </section>

    <section class="card">
        <h2 th:text="#{diff.ingredients}">Ingredients</h2>
        <div class="table-scroll">
            <table class="table">
                <thead>
                <tr><th></th><th th:text="#{diff.col.name}">Ingredient</th>
                    <th class="num" th:text="#{version.label(${view.from.versionNo})}">v1</th><th class="num" th:text="#{version.label(${view.to.versionNo})}">v2</th></tr>
                </thead>
                <tbody>
                <tr th:each="d : ${view.diff.ingredients}" th:class="${d.type().cssClass()}" th:title="#{${d.type().messageKey()}}">
                    <td class="diff-mark" th:text="${d.type().mark}">~</td>
                    <td th:text="${d.name()}">Sugar</td>
                    <td class="num"><span class="diff-old" th:if="${d.before()}" th:text="${d.before().amountLabel()}">30 g</span></td>
                    <td class="num"><span th:if="${d.after()}" th:text="${d.after().amountLabel()}">40 g</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card">
        <h2 th:text="#{diff.steps}">Steps</h2>
        <ul class="diff-steps">
            <li th:each="d : ${view.diff.steps}" th:class="${d.type().cssClass()}" th:title="#{${d.type().messageKey()}}">
                <span class="diff-mark" th:text="${d.type().mark}">~</span>
                <span th:if="${d.type().name() == 'CHANGED'}">
                    <span class="diff-old" th:text="${d.before()}">Bake 10 min</span><br>
                    <span th:text="${d.after()}">Bake 15 min</span>
                </span>
                <span th:unless="${d.type().name() == 'CHANGED'}" th:classappend="${d.type().name() == 'REMOVED'} ? 'diff-old'"
                      th:text="${d.after()} ?: ${d.before()}">Saute the onions</span>
            </li>
        </ul>
    </section>

    <a class="btn" th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="#{common.back}">Back</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
