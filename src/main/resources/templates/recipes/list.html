<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head(#{recipes.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="page-head">
        <h1 th:text="#{recipes.title}">Recipes</h1>
        <a class="btn btn-primary" th:href="@{/recipes/new}" th:text="#{recipes.new}">+ New recipe</a>
    </div>

    <p class="empty" th:if="${recipes.isEmpty()}" th:text="#{recipes.empty}"></p>

    <div class="table-scroll" th:unless="${recipes.isEmpty()}">
        <table class="table">
            <thead>
            <tr>
                <th th:text="#{recipes.col.name}">Name</th><th th:text="#{recipes.col.description}">Description</th>
                <th class="num" th:text="#{recipes.col.latest}">Latest</th><th class="num" th:text="#{recipes.col.final}">Final</th>
                <th class="num" th:text="#{recipes.col.avg}">Avg.</th><th th:text="#{recipes.col.updated}">Updated</th>
            </tr>
            </thead>
            <tbody>
            <!--/* th:text は HTML エスケープされる(XSS対策)。PHPの htmlspecialchars を毎回書くのと同じ効果 */-->
            <tr th:each="r : ${recipes}">
                <td><a th:href="@{/recipes/{id}(id=${r.id})}" th:text="${r.name}">Curry</a></td>
                <td class="muted" th:text="${r.shortDescription()}">Description</td>
                <td class="num" th:text="#{version.label(${r.latestVersionNo})}">v3</td>
                <td class="num">
                    <span th:if="${r.finalVersionNo}" class="badge badge-final" th:text="#{version.label(${r.finalVersionNo})}">v2</span>
                    <span th:unless="${r.finalVersionNo}" class="muted">—</span>
                </td>
                <td class="num" th:text="${r.averageRating} ? ${#numbers.formatDecimal(r.averageRating, 1, 2)} : '—'">4.50</td>
                <td th:text="${#temporals.format(r.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-10-24 12:00</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
