<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head(#{recipeNew.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <nav class="breadcrumb"><a th:href="@{/recipes}" th:text="#{nav.recipes}">Recipes</a> &rsaquo; <span th:text="#{recipeNew.title}"></span></nav>
    <h1 th:text="#{recipeNew.title}">New recipe</h1>
    <p class="hint" th:text="#{recipeNew.hint}"></p>

    <form class="card form" th:action="@{/recipes}" th:object="${form}" method="post" novalidate>
        <div class="form-errors" th:if="${#fields.hasAnyErrors()}" role="alert" th:text="#{common.formErrors}"></div>

        <div class="field">
            <label for="name"><th:block th:text="#{recipe.name}">Name</th:block> <span class="required" th:text="#{common.required}">Required</span></label>
            <input type="text" id="name" th:field="*{name}" maxlength="100" th:placeholder="#{recipe.name.placeholder}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="description" th:text="#{recipe.description}">Description</label>
            <textarea id="description" th:field="*{description}" rows="3" maxlength="1000"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>

        <th:block th:replace="~{fragments/ingredients :: editor}"></th:block>

        <div class="actions">
            <button type="submit" class="btn btn-primary" th:text="#{recipeNew.submit}">Create</button>
            <a class="btn btn-ghost" th:href="@{/recipes}" th:text="#{common.cancel}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/ingredient-editor.js}"></script>
</body>
</html>
