<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head(${detail.recipe.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container" th:with="recipe=${detail.recipe}, rep=${detail.representative}">
    <nav class="breadcrumb"><a th:href="@{/recipes}" th:text="#{nav.recipes}">Recipes</a> &rsaquo; <span th:text="${recipe.name}">Curry</span></nav>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="page-head">
        <div>
            <h1 th:text="${recipe.name}">Curry</h1>
            <p class="description" th:if="${recipe.description}" th:text="${recipe.description}">Description</p>
        </div>
        <div class="actions">
            <a class="btn btn-primary" th:href="@{/recipes/{id}/versions/new(id=${recipe.id})}" th:text="#{recipeDetail.editLatest}">Edit from latest version</a>
            <a class="btn" th:href="@{/recipes/{id}/analysis(id=${recipe.id})}" th:text="#{recipeDetail.analysis}">Trend analysis</a>
            <a class="btn" th:href="@{/recipes/{id}/edit(id=${recipe.id})}" th:text="#{recipeDetail.editBasic}">Edit basic info</a>
            <form th:action="@{/recipes/{id}/delete(id=${recipe.id})}" method="post" th:attr="data-confirm=#{recipeDetail.deleteConfirm}">
                <button type="submit" class="btn btn-danger" th:text="#{common.delete}">Delete</button>
            </form>
        </div>
    </div>

    <section class="card">
        <h2>
            <span th:text="${rep.isFinal()} ? #{recipeDetail.final} : #{recipeDetail.latest}">Final</span>:
            <a th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${rep.versionNo})}" th:text="#{version.label(${rep.versionNo})}">v2</a>
            <span th:replace="~{fragments/layout :: status(${rep.status})}"></span>
        </h2>
        <div class="two-col">
            <div>
                <h3 th:text="#{recipeDetail.ingredients}">Ingredients</h3>
                <table class="table table-compact">
                    <tbody>
                    <tr th:each="ing : ${rep.ingredients}">
                        <td th:text="${ing.name}">Sugar</td>
                        <td class="num" th:text="${ing.toLine().amountLabel()}">30 g</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <h3 th:text="#{recipeDetail.steps}">Steps</h3>
                <ol class="steps">
                    <li th:each="step : ${rep.stepList}" th:text="${step}">Saute the onions</li>
                </ol>
            </div>
        </div>
    </section>

    <section class="card">
        <h2 th:text="#{recipeDetail.trend}">Rating trend</h2>
        <p class="hint" th:text="#{recipeDetail.trendHint}"></p>
        <!--/* グラフ内の文言は言語ごとに data 属性で JavaScript に渡す。{0} は JS 側で置き換える */-->
        <div class="chart-box">
            <canvas id="rating-chart" role="img"
                    th:attr="data-url=@{/api/recipes/{id}/rating-trend(id=${recipe.id})},
                             aria-label=#{recipeDetail.trendAria},
                             data-label-version=#{version.label('{0}')},
                             data-label-avg=#{chart.avg},
                             data-label-cooked=#{chart.cooked('{0}')},
                             data-label-final=#{chart.final},
                             data-label-empty=#{chart.empty},
                             data-label-error=#{chart.error}"></canvas>
        </div>
    </section>

    <section class="card">
        <h2 th:text="#{recipeDetail.history}">Version history</h2>
        <!--/* 比較する2つの版をラジオボタンで選び、GET で SCR-07 に送る */-->
        <form th:action="@{/recipes/{id}/diff(id=${recipe.id})}" method="get">
            <div class="table-scroll">
                <table class="table">
                    <thead>
                    <tr>
                        <th th:text="#{history.col.from}">From</th><th th:text="#{history.col.to}">To</th>
                        <th th:text="#{history.col.version}">Version</th><th th:text="#{history.col.status}">Status</th>
                        <th th:text="#{history.col.note}">Change note</th><th th:text="#{history.col.created}">Created</th>
                        <th class="num" th:text="#{history.col.avg}">Avg.</th><th class="num" th:text="#{history.col.logs}">Cooked</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v, stat : ${detail.versions}">
                        <td><input type="radio" name="from" th:value="${v.versionNo}" th:checked="${stat.size > 1 and stat.index == stat.size - 2}" th:attr="aria-label=#{history.fromAria(${v.versionNo})}"></td>
                        <td><input type="radio" name="to" th:value="${v.versionNo}" th:checked="${stat.last}" th:attr="aria-label=#{history.toAria(${v.versionNo})}"></td>
                        <td><a th:href="@{/recipes/{id}/versions/{no}(id=${recipe.id}, no=${v.versionNo})}" th:text="#{version.label(${v.versionNo})}">v1</a></td>
                        <td><span th:replace="~{fragments/layout :: status(${v.status})}"></span></td>
                        <td th:text="${v.changeNote} ?: '—'">Added sugar</td>
                        <td th:text="${#temporals.format(v.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-24</td>
                        <td class="num" th:text="${v.averageRating} ? ${#numbers.formatDecimal(v.averageRating, 1, 2)} : '—'">4.00</td>
                        <td class="num" th:text="${v.logCount}">2</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="actions" th:if="${detail.versions.size() > 1}" style="margin-top:12px">
                <button type="submit" class="btn" th:text="#{history.compare}">Compare selected versions</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:src="@{/js/rating-chart.js}"></script>
<script th:src="@{/js/confirm.js}"></script>
</body>
</html>
