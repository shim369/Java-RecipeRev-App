# RecipeRev - local MySQL 8 for development
# Usage: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: reciperev-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-reciperev}
      MYSQL_USER: ${DB_USERNAME:-reciperev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reciperev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - reciperev-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  reciperev-mysql-data:
